name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Julia-Gabriela
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#1E5A88&color_dots=#DCEAF5,#BFD4E6,#8EB6D6,#5F8FB8,#1E5A88
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#9CC3E2&color_dots=#0D1117,#1B2A38,#24445F,#5F8FB8,#9CC3E2

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
